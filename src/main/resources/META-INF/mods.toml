modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/DeveloperNoShinigami/Eidolon-Unchained/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Eidolon Repraised (mod ID "eidolon", not "eidolon_repraised").
[[dependencies.${mod_id}]]
    modId="eidolon"
    mandatory=true
    versionRange="${eidolon_version_range}"
    ordering="AFTER"
    side="BOTH"

# KubeJS is required (decision D4).
[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=true
    versionRange="${kubejs_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"

# GeckoLib is the runtime for the deity avatars and effigies (decision D10).
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"
