# Eidolon Unchained 2.0 — pinned baseline (ICM decision D22, 2026-09-29).
# Versions were verified against their Maven repositories on 2026-09-29; see the ICM record
# projects/eidolon-unchained/knowledge/DECISIONS.md before changing any of them.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# Same Forge build Eidolon Repraised 0.3.13 targets.
forge_version=47.4.10
forge_version_range=[47.4,)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1

# --- Required dependencies ---
# Eidolon Repraised 0.3.13 (CurseForge project 870250, file eidolon_repraised-1.20.1-0.3.13.jar). Mod ID is "eidolon".
eidolon_curse_file=8723993
eidolon_version_range=[0.3.13,)
# KubeJS 2001.6.5 (maven.saps.dev) with its runtime requirements Rhino and Architectury.
kubejs_version=2001.6.5-build.26
kubejs_version_range=[2001.6.5,)
rhino_version=2001.2.3-build.10
rhino_version_range=[2001.2.2,)
architectury_version=9.1.12
architectury_version_range=[9.1.12,)
# Curios 5.x (already required by Eidolon).
curios_version=5.14.1+1.20.1
curios_version_range=[5.14.1,)
# GeckoLib 4 for the deity avatars/effigies (D10). 4.8.4 is the current 1.20.1 line; the model animation
# conventions were verified against it (see the deity model standard).
geckolib_version=4.8.4
geckolib_version_range=[4.8.4,)

# --- Mod identity ---
mod_id=eidolonunchained
mod_name=Eidolon Unchained
mod_license=All Rights Reserved
mod_version=2.0.0-alpha.1
mod_group_id=com.bluelotuscoding.eidolonunchained
mod_authors=Blue Lotus Coding
mod_description=A KubeJS-centric extension layer for Eidolon Repraised: scriptable deities, chants, casters, deity damage and AI deities.
