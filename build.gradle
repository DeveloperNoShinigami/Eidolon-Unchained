plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Dependency mods (KubeJS, GeckoLib) ship mixins with SRG names; remap them onto the dev mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // EU's own mixin (Phase 4: the brazier's ritual completion). It targets Eidolon's names, so no refmap is needed.
            arg '-mixin.config=eidolonunchained.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle adds the Forge maven and Maven Central.
    maven {
        name = "CurseMaven (Eidolon Repraised)"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "saps.dev (KubeJS)"
        url = "https://maven.saps.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        name = "latvian.dev (Rhino)"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    maven {
        name = "Illusive Soulworks (Curios)"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content { includeGroup "software.bernie.geckolib" }
    }
    // Hexblades Renewed is built from the user's source into libs/ (no Maven publication).
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Eidolon Repraised: the mod this one extends. Its mod ID is "eidolon".
    implementation fg.deobf("curse.maven:eidolon-repraised-870250:${eidolon_curse_file}")

    // KubeJS (required, D4) and what it needs at runtime.
    // Rhino and Architectury appear in KubeJS's public signatures, so they are compile dependencies too.
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // Curios: compile against the API, run with the full mod.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // GeckoLib: runtime for the deity avatars and effigies (D10).
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // Optional integrations, present in the dev runtime only (both are optional dependencies in mods.toml).
    // EntityJS: scripted GeckoLib entities/projectiles for the chant projectile showcase (Phase 3).
    runtimeOnly fg.deobf("curse.maven:entityjs-967617:${entityjs_curse_file}")
    // Hexblades Renewed: the user's 1.20.1 port, built into libs/ (see gradle.properties). Skipped when the jar is absent.
    if (file("libs/hexblades-${hexblades_version}.jar").exists()) {
        runtimeOnly fg.deobf("alexthw.hexblades:hexblades:${hexblades_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            eidolon_version_range  : eidolon_version_range, kubejs_version_range: kubejs_version_range,
            curios_version_range   : curios_version_range, geckolib_version_range: geckolib_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '2',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'eidolonunchained.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
