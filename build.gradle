buildscript {
    // ASM's remapper (asm-commons) for patchSrgMixinMods; ForgeGradle already brings ASM core.
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-commons:9.5' }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Dependency mods (KubeJS, GeckoLib) ship mixins with SRG names; remap them onto the dev mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // EU's own mixins: the config is added to every run by the mixin block below.
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            // Own folder, so a dev client and a dev server can run side by side.
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// EU's mixins (brazier ritual completion, Eidolon's mana bar). Most targets are Eidolon names (remap = false); the
// Minecraft ones are written to a refmap so they resolve to SRG names in the built jar.
mixin {
    add sourceSets.main, 'eidolonunchained.refmap.json'
    config 'eidolonunchained.mixins.json'
}

repositories {
    // ForgeGradle adds the Forge maven and Maven Central.
    maven {
        name = "CurseMaven (Eidolon Repraised)"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "saps.dev (KubeJS)"
        url = "https://maven.saps.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        name = "latvian.dev (Rhino)"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    maven {
        name = "Illusive Soulworks (Curios)"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content { includeGroup "software.bernie.geckolib" }
    }
    // Hexblades Renewed is built from the user's source into libs/ (no Maven publication).
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Eidolon Repraised: the mod this one extends. Its mod ID is "eidolon".
    implementation fg.deobf("curse.maven:eidolon-repraised-870250:${eidolon_curse_file}")

    // KubeJS (required, D4) and what it needs at runtime.
    // Rhino and Architectury appear in KubeJS's public signatures, so they are compile dependencies too.
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    implementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // Curios: compile against the API, run with the full mod.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // GeckoLib: runtime for the deity avatars and effigies (D10).
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")

    // Optional integrations, present in the dev runtime only (both are optional dependencies in mods.toml).
    // EntityJS: scripted GeckoLib entities/projectiles for the chant projectile showcase (Phase 3).
    runtimeOnly fg.deobf("curse.maven:entityjs-967617:${entityjs_curse_file}")
    // Hexblades Renewed: the user's 1.20.1 port, built into libs/ (see gradle.properties). Skipped when the jar is absent.
    // Test-only tools (see gradle.properties): Waystones + Balm, Mob Battle Mod, spark. MmmMmmMmmMmm + Moonlight are
    // added from patchSrgMixinMods below.
    runtimeOnly fg.deobf("curse.maven:waystones-245755:${waystones_curse_file}")
    runtimeOnly fg.deobf("curse.maven:balm-531761:${balm_curse_file}")
    runtimeOnly fg.deobf("curse.maven:mob-battle-mod-268746:${mobbattle_curse_file}")
    runtimeOnly fg.deobf("curse.maven:spark-361579:${spark_curse_file}")
    if (file("libs/hexblades-${hexblades_version}.jar").exists()) {
        runtimeOnly fg.deobf("alexthw.hexblades:hexblades:${hexblades_version}")
    }
}

// Test-only mods built with Architectury (MmmMmmMmmMmm and its library Moonlight): their mixin classes keep SRG member
// names (m_123_/f_123_) in @Shadow/@Accessor/@Invoker members and in annotation strings, often with no refmap, so fg.deobf
// alone leaves mixin targets that do not exist in the official-mapped dev game. patchSrgMixinMods takes the fg.deobf jars
// and renames every remaining SRG member name (declarations, references and annotation strings) to its official name
// from createSrgToMcp's output.srg (SRG ids are globally unique). Dev runtime only; jar-in-jar contents are kept as is.
def srgMixinMods = [
        dummmmmmy: "curse.maven:mmmmmmmmmmmm-225738:${dummy_curse_file}",
        moonlight: "curse.maven:selene-499980:${moonlight_curse_file}",
]
srgMixinMods.each { name, coords ->
    def conf = configurations.create("srgMixinMod_${name}") { transitive = false }
    dependencies.add(conf.name, fg.deobf(coords))
}
def patchSrgMixinMods = tasks.register('patchSrgMixinMods') {
    def srgFile = file('build/createSrgToMcp/output.srg')
    dependsOn 'createSrgToMcp'
    srgMixinMods.keySet().each { inputs.files(configurations.getByName("srgMixinMod_${it}")) }
    inputs.file(srgFile)
    srgMixinMods.keySet().each { outputs.file("build/srgMixinMods/${it}.jar") }
    doLast {
        def srgName = ~/^[mf]_\d+_$/
        def srgToken = ~/\b[mf]_\d+_\b/
        Map<String, String> names = [:]
        srgFile.eachLine { line ->
            def p = line.split(' ')
            String from = null, to = null
            if (p[0] == 'MD:') { from = p[1]; to = p[3] } else if (p[0] == 'FD:') { from = p[1]; to = p[2] }
            if (from != null) {
                from = from.substring(from.lastIndexOf('/') + 1)
                if (from ==~ srgName) names[from] = to.substring(to.lastIndexOf('/') + 1)
            }
        }
        def mapName = { String n -> (n ==~ srgName) ? names.getOrDefault(n, n) : n }
        def remapper = new org.objectweb.asm.commons.Remapper() {
            String mapMethodName(String owner, String n, String desc) { mapName(n) }
            String mapFieldName(String owner, String n, String desc) { mapName(n) }
            String mapInvokeDynamicMethodName(String n, String desc) { mapName(n) }
        }
        def patchStrings
        patchStrings = { Object v -> (v instanceof String) ? v.replaceAll(srgToken) { names.getOrDefault(it, it) } : v }
        def annotationRemapper
        annotationRemapper = { String desc, org.objectweb.asm.AnnotationVisitor av ->
            new org.objectweb.asm.commons.AnnotationRemapper(org.objectweb.asm.Opcodes.ASM9, desc, av, remapper) {
                void visit(String n, Object v) { super.visit(n, patchStrings(v)) }
                protected org.objectweb.asm.AnnotationVisitor createAnnotationRemapper(String d, org.objectweb.asm.AnnotationVisitor inner) {
                    annotationRemapper(d, inner)
                }
            }
        }
        srgMixinMods.keySet().each { name ->
            def input = configurations.getByName("srgMixinMod_${name}").singleFile
            def output = file("build/srgMixinMods/${name}.jar")
            output.parentFile.mkdirs()
            new java.util.zip.ZipFile(input).withCloseable { zip ->
                new java.util.zip.ZipOutputStream(new FileOutputStream(output)).withCloseable { out ->
                    zip.entries().each { e ->
                        byte[] bytes = zip.getInputStream(e).bytes
                        if (e.name.endsWith('.class')) {
                            def writer = new org.objectweb.asm.ClassWriter(0)
                            def visitor = new org.objectweb.asm.commons.ClassRemapper(writer, remapper) {
                                protected org.objectweb.asm.AnnotationVisitor createAnnotationRemapper(String d, org.objectweb.asm.AnnotationVisitor av) {
                                    annotationRemapper(d, av)
                                }
                                protected org.objectweb.asm.MethodVisitor createMethodRemapper(org.objectweb.asm.MethodVisitor mv) {
                                    new org.objectweb.asm.commons.MethodRemapper(org.objectweb.asm.Opcodes.ASM9, mv, remapper) {
                                        protected org.objectweb.asm.AnnotationVisitor createAnnotationRemapper(String d, org.objectweb.asm.AnnotationVisitor av) {
                                            annotationRemapper(d, av)
                                        }
                                    }
                                }
                                protected org.objectweb.asm.FieldVisitor createFieldRemapper(org.objectweb.asm.FieldVisitor fv) {
                                    new org.objectweb.asm.commons.FieldRemapper(org.objectweb.asm.Opcodes.ASM9, fv, remapper) {
                                        protected org.objectweb.asm.AnnotationVisitor createAnnotationRemapper(String d, org.objectweb.asm.AnnotationVisitor av) {
                                            annotationRemapper(d, av)
                                        }
                                    }
                                }
                            }
                            new org.objectweb.asm.ClassReader(bytes).accept(visitor, 0)
                            bytes = writer.toByteArray()
                        }
                        def copy = new java.util.zip.ZipEntry(e.name)
                        copy.time = e.time
                        out.putNextEntry(copy)
                        out.write(bytes)
                        out.closeEntry()
                    }
                }
            }
            logger.lifecycle("patchSrgMixinMods: ${input.name} -> ${output.name}")
        }
    }
}
dependencies {
    runtimeOnly files(patchSrgMixinMods)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            eidolon_version_range  : eidolon_version_range, kubejs_version_range: kubejs_version_range,
            curios_version_range   : curios_version_range, geckolib_version_range: geckolib_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '2',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'eidolonunchained.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
